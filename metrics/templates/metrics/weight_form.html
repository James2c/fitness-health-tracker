{% extends "base.html" %}

{% block title %}
Add Weight | Fitness & Health Tracker
{% endblock %}

{% block content %}


<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="mb-4">
            <h1 class="fw-bold">
                Add Weight
            </h1>

            <p class="text-muted">
                Record a new weight measurement.
            </p>
        </div>

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Weight
                        </button>

                        <a
                            href="{% url 'weight_list' %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


{% endblock %}
