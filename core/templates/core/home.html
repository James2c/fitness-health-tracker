{% extends "base.html" %}

{% block title %}
Dashboard | Fitness & Health Tracker
{% endblock %}

{% block content %}

<div class="mb-4">
    <h1 class="fw-bold">Dashboard</h1>
    <p class="text-muted">
        Fitness and health tracker.
    </p>
</div>

<div class="row g-4">

    <div class="col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center">
                <h6 class="text-muted">Current Weight</h6>
                <h2 class="fw-bold">--</h2>
                <small class="text-muted">kg</small>
            </div>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center">
                <h6 class="text-muted">Calories Today</h6>
                <h2 class="fw-bold">--</h2>
                <small class="text-muted">kcal</small>
            </div>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center">
                <h6 class="text-muted">Protein Today</h6>
                <h2 class="fw-bold">--</h2>
                <small class="text-muted">g</small>
            </div>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center">
                <h6 class="text-muted">Workouts</h6>
                <h2 class="fw-bold">--</h2>
                <small class="text-muted">this week</small>
            </div>
        </div>
    </div>

</div>

{% endblock %}
